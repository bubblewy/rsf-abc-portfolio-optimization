project:
  name: rsfabc_portfolio
  protocol_version: stage1_design_freeze_v1.0
  experiment_label: confirmatory_v1

data:
  processed_dir: data/processed
  start_date: "2006-01-01"
  end_date: "2025-12-31"

walk_forward:
  train_days: 504
  rebalance: monthly

portfolio_defaults:
  cardinality: 10
  lower_bound: 0.02
  upper_bound: 0.30
  transaction_cost_bps: 25
  cost_amortization_days: 21
  omega_threshold: 0.0
  omega_threshold_mode: fixed
  epsilon: 1.0e-12

optimizers:
  population_size: 30
  max_evaluations: 3000
  abc_limit: 100
  kappa: 4.0
  student_df: 3.0
  student_clip: 4.0
  pso_inertia_start: 0.9
  pso_inertia_end: 0.4
  pso_c1: 1.49618
  pso_c2: 1.49618
  de_f: 0.5
  de_cr: 0.9

execution:
  n_jobs: 6
  stochastic_methods: [rsf_abc, standard_abc, ht_abc, rs_light_abc, pso, de]
  deterministic_methods: [ew_n, ew_k, mv_k, omega_milp]
  main_seeds: [101, 202, 303, 404, 505]
  robustness_seeds: [101, 202, 303]
  diagnostic_seeds:
    start: 1001
    end: 1030
  kappa_sensitivity_seeds:
    start: 1001
    end: 1010
  diagnostic_dates: 12

main:
  condition_id: main_n49_k10_c25_tau0
  universe: 49

robustness:
  - condition_id: scale_n10_k5
    universe: 10
    cardinality: 5
  - condition_id: scale_n30_k10
    universe: 30
    cardinality: 10
  - condition_id: cardinality_n49_k5
    universe: 49
    cardinality: 5
  - condition_id: cardinality_n49_k15
    universe: 49
    cardinality: 15
  - condition_id: cost_n49_c10
    universe: 49
    transaction_cost_bps: 10
  - condition_id: cost_n49_c50
    universe: 49
    transaction_cost_bps: 50
  - condition_id: threshold_n49_equal_weight_mean
    universe: 49
    omega_threshold_mode: equal_weight_mean

robustness_methods:
  stochastic: [rsf_abc, standard_abc, de]
  deterministic: [ew_n, ew_k, mv_k, omega_milp]
